name: RKE2 시험 (운영과 같은 종류)

# 수세 RKE2 + Traefik · CNPG · Strimzi · Redis · MinIO 위에서 구성 수집 · 클러스터 점검 · 배포 묶음 점검을 돌린다.
on:
  push:
    branches: [main]
    paths: ["site-kit/**", "ci/rke2-*.sh", "ci/test-rke2.sh", ".github/workflows/rke2-test.yml"]
  workflow_dispatch:

jobs:
  rke2:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: RKE2 시험 환경 만들기
        run: sudo bash ci/rke2-setup.sh
      - name: 세 스크립트 돌리고 확인
        run: sudo bash ci/test-rke2.sh
      - name: 결과 모으기
        if: always()
        run: sudo chmod -R a+rX /tmp/rke2-results || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rke2-results
          path: /tmp/rke2-results
          retention-days: 14
      - name: 실패 때 상태
        if: failure()
        run: |
          export PATH=$PATH:/var/lib/rancher/rke2/bin KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          sudo -E kubectl get pods -A -o wide || true
          sudo journalctl -u rke2-server --no-pager | tail -50 || true
