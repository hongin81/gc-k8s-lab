name: 연습장 자동 시험

# 킬러코다에서 사람이 누르는 순서 그대로, 우분투 + kind 연습장에서 처음부터 끝까지 돌린다.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 연습장 준비 (kind)
        run: sudo bash lab/setup.sh --mode kind

      - name: 단계별 실행 상자 그대로 실행 + CHECK
        run: sudo python3 ci/run-steps.py gc-deploy-lab

      - name: 배포 묶음 점검 시험 (정상 묶음 · 일부러 틀린 묶음 9가지)
        run: sudo bash ci/test-bundle-check.sh

      - name: 소스 수집 시험 (리눅스)
        run: bash ci/test-scan-source.sh

      - name: 구성 수집 시험 (가짜 비밀번호가 새지 않는지)
        run: sudo bash ci/test-collect.sh

      - name: 현장 키트 시험 (점검 스크립트 · 첫 배포 꾸러미)
        run: sudo bash ci/test-site-kit.sh

      - name: 꾸러미용 이미지 꺼내기
        run: |
          T=$(sudo cat /root/.lab-old-tag)
          sudo cp -r /root/out/$T ./sample-images
          sudo chown -R "$USER" ./sample-images
          ls -lh sample-images

      - uses: actions/upload-artifact@v4
        with:
          name: sample-images
          path: sample-images
          retention-days: 30

      - name: 실패 때 상태
        if: failure()
        run: |
          sudo kubectl get nodes -o wide || true
          sudo kubectl get pods -A -o wide || true
          sudo kubectl -n sample get events --sort-by=.lastTimestamp | tail -40 || true
          sudo kubectl -n sample describe pods | tail -120 || true

  source-scan-windows:
    # 개발 PC 가 윈도우일 때도 소스 수집이 도는지
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 소스 수집 (윈도우)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\work | Out-Null
          Copy-Item -Recurse $env:GITHUB_WORKSPACE C:\work\gc-k8s-lab
          Remove-Item -Recurse -Force C:\work\gc-k8s-lab\ci
          Set-Location C:\work
          node $env:GITHUB_WORKSPACE\site-kit\scan-source.mjs C:\work
          $f = Get-ChildItem C:\work\source-scan-*.txt | Select-Object -First 1
          if (-not $f) { throw "결과 파일 없음" }
          $t = Get-Content $f.FullName -Raw -Encoding utf8
          foreach ($w in @("스프링부트 실행 jar", "sample-api", "Dockerfile.was", "lab/gc-app-deploy/build/Dockerfile.was", "Git ·",
                         "lab/gc-app-deploy/k8s/services/sample/ — kustomize · 네임스페이스 sample", "Service sample-api 8080→http → Deployment sample-api")) {
            if (-not $t.Contains($w)) { throw "못 잡음: $w" }
          }
          Write-Host "윈도우 소스 수집 시험 통과"
