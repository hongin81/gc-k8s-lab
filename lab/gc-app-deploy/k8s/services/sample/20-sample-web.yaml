# 화면(web) — 파드 2개, 업무 서버(lab.io/role=app)에만, 서버마다 하나씩 갈리게
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web
  labels: { app: sample-web }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: sample-web }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # 새 파드가 준비돼야 기존 파드를 내림 (무중단)
  template:
    metadata:
      labels: { app: sample-web }
    spec:
      nodeSelector:
        lab.io/role: app
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: sample-web }
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sample-web
          image: docker.io/lab/sample-web          # 태그는 kustomization.yaml 의 newTag
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sample-web
spec:
  selector: { app: sample-web }
  ports:
    - { name: http, port: 8080, targetPort: http }
